# fractal1: AICamera notebook (SSG) + same-origin bay feed proxy.
# Installed to /etc/nginx/nginx.conf by install.sh. Tailnet + loopback only, never 0.0.0.0.
# :8080 on loopback is the target for `tailscale serve --https=443` once tailnet HTTPS is on.
worker_processes 2;

events {
	worker_connections 512;
}

http {
	include mime.types;
	types_hash_max_size 4096;
	default_type application/octet-stream;
	sendfile on;
	tcp_nopush on;
	server_tokens off;
	access_log off;

	gzip on;
	gzip_min_length 1024;
	gzip_types text/css application/javascript application/json image/svg+xml model/stl model/gltf-binary;

	server {
		listen 100.103.147.70:80;
		listen 127.0.0.1:8080;
		server_name fractal1 fractal1.taild69dc7.ts.net;

		root /srv/aicam/site;
		error_page 404 /404.html;

		location /_app/immutable/ {
			add_header Cache-Control "public, max-age=31536000, immutable";
			try_files $uri =404;
		}

		location /bay-api/ {
			proxy_pass http://100.103.147.70:8745/;
			proxy_http_version 1.1;
			proxy_set_header Host $host;
			proxy_buffering off;
			proxy_read_timeout 120s;
		}

		location / {
			add_header Cache-Control "no-cache";
			try_files $uri $uri.html $uri/index.html =404;
		}
	}
}
