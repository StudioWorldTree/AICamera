<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<meta name="color-scheme" content="dark light" />
		<meta
			name="description"
			content="Hardware notebook for the All Systems Go AI camera: Thor body, HEVC record path, Cooke /i lens metadata, hybrid CSI/PoE plant."
		/>
		%sveltekit.head%
		<script>
			(function () {
				try {
					var t = localStorage.getItem('aicam-theme');
					if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
				} catch (e) {}
			})();
		</script>
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
